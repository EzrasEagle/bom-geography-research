  - id: desolation
    name_text: Desolation
    real_world: North of neck (toward Gulf / northward lands)
  - id: cumorah
    name_text: Cumorah (final)
    real_world: Southern Mexico hill country (not NY) in many limited models
  - id: landing
    name_text: Lehi landing
    real_world: Pacific Mesoamerica coast candidates
  - id: sea-east
    name_text: Sea east
